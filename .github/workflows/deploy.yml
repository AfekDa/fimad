name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Validates the build on a PR without ever publishing — see the deploy job's
  # `if` guard below. There is only one Pages site per repo, so a PR cannot get
  # its own preview URL; this checks the half that actually varies, the build.
  pull_request:
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead, and don't cancel a run that is
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # public/cms is gitignored, so CI always starts cold. Fetching all 278
      # base44 images at CONCURRENCY=8 drops connections on a cold run (~160
      # failed locally); the script degrades those to remote hot-links rather
      # than failing, so a bad run silently ships a slower site. Downloads are
      # cached by url hash, so a second pass only retries what missed — that
      # converged to "278 local, 0 left remote" every time locally.
      - name: Sync CMS images
        run: npm run sync:cms || npm run sync:cms

      # `npm run build` is `astro check && astro build`, so a type error fails
      # the deploy rather than shipping a broken page. Its `prebuild` hook runs
      # the sync again, which is a no-op against the warm cache above.
      - name: Build
        run: npm run build

      # A deploy replaces the whole site, which deletes the previous build's
      # hashed /_astro files while open tabs and the CDN's ten-minute copies of
      # every page still point at them. These three steps keep the last three
      # days of those files published, so a page from an earlier deploy still
      # swaps screens in place instead of flashing through a full reload. The
      # set travels between runs in the Actions cache; see
      # scripts/carry-assets.mjs. PR runs never publish, so they stay out of it.
      - name: Restore earlier deploys' hashed assets
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: .cache/carried-assets
          key: carried-assets-${{ github.run_id }}
          restore-keys: carried-assets-

      - name: Carry earlier deploys' hashed assets forward
        if: github.event_name != 'pull_request'
        run: node scripts/carry-assets.mjs

      - name: Save the published asset set for the next deploy
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: .cache/carried-assets
          key: carried-assets-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # Publish only from main. A PR run stops after build.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
